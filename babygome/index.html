<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝贝回家</title>
    <style>
        :root {
            --bg: #e8ecf1;
            --bg-alt: #e3e7ed;
            --shadow-dark: #c5cad3;
            --shadow-light: #ffffff;
            --text-primary: #4a5568;
            --text-secondary: #8892a0;
            --accent-soft: #7b8ca8;
            --accent-warm: #e07b5a;
            --accent-warm-glow: rgba(224, 123, 90, 0.2);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.3, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(200, 210, 220, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 75%, rgba(180, 190, 205, 0.2) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(220, 225, 235, 0.3) 0%, transparent 70%);
            background-attachment: fixed;
        }

        /* ============ 主容器 ============ */
        .main-container {
            width: 100%;
            max-width: 620px;
            background: var(--bg);
            border-radius: var(--radius-lg);
            padding: 36px 32px 32px;
            box-shadow:
                12px 12px 28px var(--shadow-dark),
                -12px -12px 28px var(--shadow-light),
                0px 0px 0px 1px rgba(255, 255, 255, 0.45) inset;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            transition: box-shadow var(--transition);
            position: relative;
            overflow: visible;
        }

        .main-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.7) 20%,
                    rgba(255, 255, 255, 0.9) 50%,
                    rgba(255, 255, 255, 0.7) 80%,
                    transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ============ 标题区域 ============ */
        .header-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.04em;
            text-align: center;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title .title-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg);
            box-shadow:
                4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
            font-size: 1.3rem;
        }

        .page-subtitle {
            font-size: 0.82rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-align: center;
            user-select: none;
        }

        /* ============ 展示框 ============ */
        .display-frame {
            width: 100%;
            max-width: 540px;
            background: var(--bg);
            border-radius: var(--radius-lg);
            box-shadow:
                inset 8px 8px 20px var(--shadow-dark),
                inset -8px -8px 20px var(--shadow-light);
            position: relative;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            height: auto;
            min-height: 0;
            z-index: 1;
        }

        .display-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12px;
            right: 12px;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(200, 210, 225, 0.5) 25%,
                    rgba(200, 210, 225, 0.7) 50%,
                    rgba(200, 210, 225, 0.5) 75%,
                    transparent);
            z-index: 5;
            pointer-events: none;
            border-radius: 50%;
        }

        .image-container {
            width: 100%;
            height: auto;
            max-height: 80vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 12px;
            position: relative;
            z-index: 2;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: rgba(160, 170, 185, 0.6) rgba(0, 0, 0, 0.05);
        }

        .image-container::-webkit-scrollbar {
            width: 6px;
        }
        .image-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 10px;
            margin: 16px 0;
        }
        .image-container::-webkit-scrollbar-thumb {
            background: rgba(160, 170, 185, 0.55);
            border-radius: 10px;
            transition: background 0.3s;
        }
        .image-container::-webkit-scrollbar-thumb:hover {
            background: rgba(130, 145, 165, 0.7);
        }

        .display-image {
            max-width: 100%;
            width: auto;
            height: auto;
            display: block;
            border-radius: 10px;
            transition: opacity 0.5s ease, transform 0.4s ease;
            opacity: 0;
            transform: scale(0.96);
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            object-fit: contain;
            margin: auto;
        }
        .display-image.loaded {
            opacity: 1;
            transform: scale(1);
        }
        .display-image:hover {
            transform: scale(1.01);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.1);
            transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.5s ease;
        }

        /* ============ 加载动画 ============ */
        .loading-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loading-indicator.hidden {
            opacity: 0;
        }

        .spinner-ring {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg);
            box-shadow:
                3px 3px 8px var(--shadow-dark),
                -3px -3px 8px var(--shadow-light);
            position: relative;
            animation: softSpin 1.4s linear infinite;
        }
        .spinner-ring::before {
            content: '';
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: var(--bg-alt);
            box-shadow:
                inset 2px 2px 5px var(--shadow-dark),
                inset -2px -2px 5px var(--shadow-light);
        }
        .spinner-ring::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 50%;
            width: 4px;
            height: 12px;
            background: #e07b5a;
            border-radius: 3px;
            transform: translateX(-50%);
            box-shadow: 0 0 8px rgba(224, 123, 90, 0.5);
        }

        @keyframes softSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.82rem;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            animation: breathe 1.8s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ============ 空状态 ============ */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .empty-state.hidden {
            opacity: 0;
        }
        .empty-icon {
            font-size: 2.8rem;
            opacity: 0.5;
            filter: grayscale(0.3);
        }
        .empty-text {
            font-size: 0.9rem;
            letter-spacing: 0.03em;
        }

        /* ============ 刷新按钮 ============ */
        .refresh-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: var(--bg);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 550;
            color: var(--text-primary);
            letter-spacing: 0.04em;
            outline: none;
            font-family: inherit;
            transition: all var(--transition);
            box-shadow:
                6px 6px 14px var(--shadow-dark),
                -6px -6px 14px var(--shadow-light);
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .refresh-btn:hover {
            box-shadow:
                8px 8px 18px var(--shadow-dark),
                -8px -8px 18px var(--shadow-light);
            transform: translateY(-2px);
            color: #3d4f5f;
        }

        .refresh-btn:active {
            box-shadow:
                inset 4px 4px 10px var(--shadow-dark),
                inset -4px -4px 10px var(--shadow-light);
            transform: translateY(0px);
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 刷新按钮旋转动画 */
        .refresh-btn.refreshing .refresh-icon {
            animation: iconSpin 0.7s ease-in-out;
        }

        @keyframes iconSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-icon {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .refresh-btn:hover .refresh-icon {
            transform: rotate(90deg);
        }

        /* ============ 底部信息条 ============ */
        .info-strip {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.76rem;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            user-select: none;
            text-align: center;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
            animation: statusDotPulse 2.2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes statusDotPulse {
            0%, 100% { box-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }
            50% { box-shadow: 0 0 14px rgba(16, 185, 129, 0.8); }
        }

        /* ============ Toast 提示 ============ */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: var(--bg);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            z-index: 999;
            pointer-events: none;
            box-shadow:
                6px 6px 16px var(--shadow-dark),
                -6px -6px 16px var(--shadow-light);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ============ 响应式设计 ============ */

        /* 平板端 */
        @media (max-width: 768px) {
            .main-container {
                padding: 28px 22px 26px;
                border-radius: var(--radius-md);
                gap: 20px;
                box-shadow:
                    9px 9px 22px var(--shadow-dark),
                    -9px -9px 22px var(--shadow-light),
                    0px 0px 0px 1px rgba(255, 255, 255, 0.4) inset;
            }
            .page-title {
                font-size: 1.3rem;
            }
            .page-title .title-icon {
                width: 36px;
                height: 36px;
                font-size: 1.15rem;
            }
            .page-subtitle {
                font-size: 0.76rem;
            }
            .display-frame {
                max-width: 100%;
                border-radius: var(--radius-md);
            }
            .image-container {
                max-height: 75vh;
                padding: 10px;
            }
            .display-image {
                border-radius: 8px;
            }
            .refresh-btn {
                padding: 13px 24px;
                font-size: 0.88rem;
                border-radius: 44px;
            }
            .spinner-ring {
                width: 36px;
                height: 36px;
            }
            .loading-text {
                font-size: 0.76rem;
            }
            .info-strip {
                font-size: 0.7rem;
            }
            .toast {
                top: 20px;
                padding: 10px 20px;
                font-size: 0.82rem;
                border-radius: 36px;
            }
        }

        /* 手机端 */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .main-container {
                padding: 20px 14px 18px;
                border-radius: 18px;
                gap: 16px;
                box-shadow:
                    6px 6px 16px var(--shadow-dark),
                    -6px -6px 16px var(--shadow-light),
                    0px 0px 0px 1px rgba(255, 255, 255, 0.35) inset;
            }
            .page-title {
                font-size: 1.15rem;
                gap: 8px;
            }
            .page-title .title-icon {
                width: 32px;
                height: 32px;
                font-size: 1rem;
                box-shadow:
                    3px 3px 6px var(--shadow-dark),
                    -3px -3px 6px var(--shadow-light);
            }
            .page-subtitle {
                font-size: 0.7rem;
            }
            .display-frame {
                border-radius: 14px;
                box-shadow:
                    inset 4px 4px 12px var(--shadow-dark),
                    inset -4px -4px 12px var(--shadow-light);
            }
            .image-container {
                max-height: 65vh;
                padding: 6px;
            }
            .display-image {
                border-radius: 6px;
            }
            .refresh-btn {
                padding: 12px 22px;
                font-size: 0.82rem;
                border-radius: 40px;
                gap: 8px;
                box-shadow:
                    4px 4px 9px var(--shadow-dark),
                    -4px -4px 9px var(--shadow-light);
            }
            .refresh-icon {
                width: 16px;
                height: 16px;
                font-size: 0.9rem;
            }
            .spinner-ring {
                width: 30px;
                height: 30px;
            }
            .loading-text {
                font-size: 0.7rem;
            }
            .empty-icon {
                font-size: 2.2rem;
            }
            .empty-text {
                font-size: 0.76rem;
            }
            .info-strip {
                font-size: 0.66rem;
                gap: 6px;
            }
            .status-dot {
                width: 6px;
                height: 6px;
            }
            .toast {
                top: 14px;
                padding: 8px 16px;
                font-size: 0.75rem;
                border-radius: 32px;
                box-shadow:
                    4px 4px 10px var(--shadow-dark),
                    -4px -4px 10px var(--shadow-light);
            }
        }

        /* 超小屏 */
        @media (max-width: 360px) {
            .main-container {
                padding: 16px 8px 14px;
                gap: 12px;
                border-radius: 14px;
            }
            .page-title {
                font-size: 1.05rem;
            }
            .page-title .title-icon {
                width: 28px;
                height: 28px;
                font-size: 0.9rem;
            }
            .display-frame {
                border-radius: 12px;
            }
            .image-container {
                max-height: 58vh;
                padding: 4px;
            }
            .display-image {
                border-radius: 5px;
            }
            .refresh-btn {
                padding: 10px 18px;
                font-size: 0.76rem;
                border-radius: 36px;
            }
            .info-strip {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 标题区域 -->
        <div class="header-area">
            <div class="page-title">
                <span class="title-icon">🏠</span>
                <span>宝贝回家</span>
            </div>
            <p class="page-subtitle">每一次刷新，都是一份希望</p>
        </div>

        <!-- 展示框 -->
        <div class="display-frame" id="displayFrame">
            <!-- 加载指示器 -->
            <div class="loading-indicator" id="loadingIndicator">
                <div class="spinner-ring"></div>
                <span class="loading-text">正在加载...</span>
            </div>
            <!-- 空状态 -->
            <div class="empty-state hidden" id="emptyState">
                <span class="empty-icon">🖼️</span>
                <span class="empty-text">暂无图片内容</span>
            </div>
            <!-- 图片容器 -->
            <div class="image-container" id="imageContainer">
                <img class="display-image" id="displayImage" src="" alt="宝贝回家图片" loading="eager">
            </div>
        </div>

        <!-- 刷新按钮 -->
        <button class="refresh-btn" id="refreshBtn" aria-label="刷新图片">
            <span class="refresh-icon">🔄</span>
            <span>刷新图片</span>
        </button>

        <!-- 状态信息条 -->
        <div class="info-strip">
            <span class="status-dot"></span>
            <span id="statusText">就绪 — 宝贝回家图片已加载</span>
        </div>
    </div>

    <script>
        (function() {
            // ============ API 配置 ============
            const API_URL = 'https://api.xunjinlu.fun/api/babygome/index.php?type=img';

            // ============ DOM 元素 ============
            const displayFrame = document.getElementById('displayFrame');
            const displayImage = document.getElementById('displayImage');
            const imageContainer = document.getElementById('imageContainer');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const emptyState = document.getElementById('emptyState');
            const statusText = document.getElementById('statusText');
            const refreshBtn = document.getElementById('refreshBtn');
            const toast = document.getElementById('toast');

            let isLoading = false;
            let toastTimer = null;

            // ============ Toast 提示 ============
            function showToast(message, duration = 2200) {
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, duration);
            }

            // ============ 展示框最小高度控制 ============
            function setDisplayMinHeight(minHeight) {
                displayFrame.style.minHeight = minHeight;
            }

            function clearDisplayMinHeight() {
                displayFrame.style.minHeight = '';
            }

            // ============ 加载状态 ============
            function showLoading() {
                isLoading = true;
                setDisplayMinHeight('240px');
                loadingIndicator.classList.remove('hidden');
                emptyState.classList.add('hidden');
                displayImage.classList.remove('loaded');
                displayImage.src = '';
                displayImage.style.display = 'none';
                displayFrame.style.boxShadow =
                    'inset 8px 8px 20px var(--shadow-dark), inset -8px -8px 20px var(--shadow-light), 0 0 0 2px rgba(224,123,90,0.18)';
                statusText.textContent = '正在加载宝贝回家图片...';
            }

            function hideLoading() {
                isLoading = false;
                loadingIndicator.classList.add('hidden');
                displayFrame.style.boxShadow =
                    'inset 8px 8px 20px var(--shadow-dark), inset -8px -8px 20px var(--shadow-light)';
            }

            // ============ 空状态 ============
            function showEmptyState() {
                emptyState.classList.remove('hidden');
                displayImage.classList.remove('loaded');
                displayImage.src = '';
                displayImage.style.display = 'none';
                hideLoading();
                setDisplayMinHeight('220px');
                statusText.textContent = '暂无图片，请点击刷新重试';
            }

            // ============ 显示图片 ============
            function showImage(src) {
                emptyState.classList.add('hidden');
                displayImage.style.display = 'block';
                displayImage.src = src;
                displayImage.onload = function() {
                    displayImage.classList.add('loaded');
                    hideLoading();
                    clearDisplayMinHeight();
                    statusText.textContent = '就绪 — 宝贝回家图片已加载';
                };
                displayImage.onerror = function() {
                    attemptFetchLoad(src);
                };
            }

            // ============ 尝试 fetch 加载 ============
            async function attemptFetchLoad(url) {
                try {
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: { 'Accept': 'image/*, application/json, */*' },
                        signal: AbortSignal.timeout(20000),
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const contentType = response.headers.get('Content-Type') || '';
                    if (contentType.includes('image/')) {
                        const blob = await response.blob();
                        const blobUrl = URL.createObjectURL(blob);
                        if (displayImage.src && displayImage.src.startsWith('blob:')) {
                            URL.revokeObjectURL(displayImage.src);
                        }
                        displayImage.src = blobUrl;
                        displayImage.style.display = 'block';
                        displayImage.onload = function() {
                            displayImage.classList.add('loaded');
                            hideLoading();
                            clearDisplayMinHeight();
                            statusText.textContent = '就绪 — 宝贝回家图片已加载';
                        };
                        displayImage.onerror = function() {
                            hideLoading();
                            showEmptyState();
                        };
                    } else if (contentType.includes('json') || contentType.includes('text/')) {
                        const text = await response.text();
                        let data;
                        try { data = JSON.parse(text); } catch (e) { throw new Error('无法解析响应'); }
                        const extractedUrl = extractImageUrl(data);
                        if (extractedUrl) {
                            showImage(extractedUrl);
                        } else {
                            throw new Error('未找到图片URL');
                        }
                    } else {
                        showImage(url);
                    }
                } catch (err) {
                    console.warn('Fetch加载失败:', err.message);
                    if (displayImage.src !== url || !displayImage.classList.contains('loaded')) {
                        displayImage.src = url;
                        displayImage.style.display = 'block';
                        displayImage.onload = function() {
                            displayImage.classList.add('loaded');
                            hideLoading();
                            clearDisplayMinHeight();
                            statusText.textContent = '就绪 — 宝贝回家图片已加载';
                        };
                        displayImage.onerror = function() {
                            hideLoading();
                            showEmptyState();
                        };
                    } else {
                        hideLoading();
                        showEmptyState();
                    }
                }
            }

            // ============ 从JSON中提取图片URL ============
            function extractImageUrl(data) {
                if (!data || typeof data !== 'object') return null;
                const candidates = ['img', 'image', 'url', 'src', 'pic', 'picture', 'data', 'imgUrl', 'imageUrl',
                    'picUrl', 'cover', 'result', 'content', 'body'
                ];
                for (const key of candidates) {
                    if (data[key] && typeof data[key] === 'string' &&
                        (data[key].startsWith('http') || data[key].startsWith('/') || data[key].startsWith('data:'))) {
                        return data[key];
                    }
                }
                for (const key of ['data', 'result', 'body', 'content', 'info']) {
                    if (data[key] && typeof data[key] === 'object') {
                        const nested = extractImageUrl(data[key]);
                        if (nested) return nested;
                    }
                }
                if (typeof data === 'string' && (data.startsWith('http') || data.startsWith('data:'))) {
                    return data;
                }
                for (const [key, value] of Object.entries(data)) {
                    if (typeof value === 'string' &&
                        (value.startsWith('http://') || value.startsWith('https://') || value.startsWith('data:image/'))) {
                        if (/\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)(\?|$)/i.test(value) ||
                            value.includes('image') || value.includes('img') || value.includes('pic') ||
                            value.startsWith('data:image/')) {
                            return value;
                        }
                    }
                }
                return null;
            }

            // ============ 加载图片 ============
            function loadImage() {
                if (isLoading) return;
                showLoading();
                // 添加时间戳避免缓存
                const urlWithTimestamp = API_URL + '&_t=' + Date.now();
                showImage(encodeURI(urlWithTimestamp));
            }

            // ============ 刷新按钮点击 ============
            refreshBtn.addEventListener('click', function() {
                if (isLoading) {
                    showToast('⏳ 正在加载中，请稍候...', 1800);
                    return;
                }
                // 触发旋转动画
                refreshBtn.classList.add('refreshing');
                setTimeout(() => {
                    refreshBtn.classList.remove('refreshing');
                }, 700);
                // 清理旧 blob URL
                if (displayImage.src && displayImage.src.startsWith('blob:')) {
                    URL.revokeObjectURL(displayImage.src);
                }
                loadImage();
            });

            // ============ 图片点击 - 新窗口打开 ============
            displayImage.addEventListener('click', function() {
                if (displayImage.classList.contains('loaded') && displayImage.src) {
                    window.open(displayImage.src, '_blank', 'noopener,noreferrer');
                }
            });

            // ============ 键盘快捷键支持 ============
            document.addEventListener('keydown', function(e) {
                // 按 R 键刷新
                if (e.key === 'r' || e.key === 'R') {
                    // 确保没有在输入框中
                    const activeEl = document.activeElement;
                    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable)) {
                        return;
                    }
                    e.preventDefault();
                    refreshBtn.click();
                }
            });

            // ============ 页面可见性变化 ============
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' &&
                    !displayImage.classList.contains('loaded') &&
                    !isLoading) {
                    loadImage();
                }
            });

            // ============ 初始化 ============
            function init() {
                loadImage();
                statusText.textContent = '正在连接 — 宝贝回家图片加载中...';
            }

            init();

            // ============ 暴露API到全局 ============
            window.babyHome = {
                refresh: () => {
                    if (displayImage.src && displayImage.src.startsWith('blob:')) {
                        URL.revokeObjectURL(displayImage.src);
                    }
                    loadImage();
                },
                getImageSrc: () => displayImage.src,
                isLoading: () => isLoading,
                showToast,
            };

            console.log('✅ 宝贝回家图片展示页已就绪');
            console.log('   API: ' + API_URL);
            console.log('   按 R 键可快速刷新图片');
            console.log('   可通过 window.babyHome 进行高级操作');
            console.log('   例如: babyHome.refresh() 刷新图片');
        })();
    </script>
</body>
</html>
