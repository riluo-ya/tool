<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OC 设定书</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            overflow-x: hidden;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f0e8;
            background-image: radial-gradient(#ebe3d5 1px, transparent 1px);
            background-size: 20px 20px;
            color: #3a332d;
            line-height: 1.65;
            padding: 24px 12px;
            font-size: 15px;
            min-height: 100vh;
        }
        .storage-float {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(255, 253, 249, 0.92);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #ebe3d5;
            font-size: 12px;
            color: #948473;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(90, 70, 50, 0.08);
            transition: all 0.3s ease;
            user-select: none;
        }
        .storage-float.warning {
            background: rgba(184, 112, 112, 0.95);
            color: #fffdf9;
            border-color: #b87070;
            box-shadow: 0 4px 12px rgba(184, 112, 112, 0.3);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fffdf9;
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(90, 70, 50, 0.1);
            border: 1px solid #ebe3d5;
        }
        h1 {
            text-align: center;
            color: #5c4b3a;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 4px;
        }
        .subtitle {
            text-align: center;
            color: #948473;
            font-size: 13px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .backup-tip {
            text-align: center;
            color: #b85450;
            font-size: 12px;
            margin: 0 auto 20px;
            padding: 8px 16px;
            width: fit-content;
            max-width: 90%;
            background: #fdf2f2;
            border: 1px solid #f5d0d0;
            border-radius: 8px;
            line-height: 1.5;
        }
        .status-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .save-status {
            font-size: 12px;
            height: 18px;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.25s ease;
            color: #7a9e7e;
        }
        .save-status.show { opacity: 1; transform: translateY(0); }
        .save-status.error { color: #b87070; }
        .top-btn-group {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
        }
        .section {
            margin-bottom: 28px;
            background: #faf7f1;
            border-radius: 12px;
            padding: 22px 24px;
            border: 1px solid #ebe3d5;
            transition: all 0.25s ease;
        }
        .section:hover {
            border-color: #d9cfbe;
            box-shadow: 0 2px 12px rgba(139, 115, 85, 0.06);
        }
        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: #5c4b3a;
            padding-bottom: 8px;
            margin: -4px -2px 18px -2px;
            border-bottom: 1px dashed #c9bfa8;
            letter-spacing: 1px;
        }
        .sub-section-title {
            font-size: 15px;
            font-weight: 600;
            color: #7a6a58;
            margin: 18px 0 10px;
            padding-left: 10px;
            border-left: 3px solid #b8a88a;
        }
        .form-item {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .form-item label {
            font-weight: 500;
            margin-bottom: 6px;
            color: #6b5a48;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fullscreen-btn {
            font-size: 12px;
            padding: 2px 8px;
            border: 1px solid #d9cfbe;
            background: #fffdf9;
            color: #8b7355;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .fullscreen-btn:hover {
            background: #f5f0e8;
            border-color: #b8a88a;
        }
        .form-item input[type="text"],
        .form-item input[type="date"],
        .form-item textarea {
            padding: 10px 14px;
            border: 1px solid #d9cfbe;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.25s ease;
            width: 100%;
            background: #fffdf9;
            color: #3a332d;
        }
        .form-item input::placeholder,
        .form-item textarea::placeholder {
            color: #b8a994;
        }
        .form-item input:focus,
        .form-item textarea:focus {
            outline: none;
            border-color: #b8a88a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(184, 168, 138, 0.15);
            transform: translateY(-1px);
        }
        .form-item textarea {
            resize: vertical;
            min-height: 72px;
            line-height: 1.6;
        }
        .birthday-tip {
            font-size: 12px;
            margin-top: 4px;
            min-height: 16px;
            color: #b0a18c;
        }
        .birthday-tip.valid {
            color: #7a9e7e;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .btn-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin: 10px 0 24px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            min-height: 46px;
            flex: 1;
            min-width: 120px;
            max-width: 180px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(90, 70, 50, 0.15);
        }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: #8b7355; }
        .btn-success { background: #7a9e7e; }
        .btn-warning { background: #c49a6c; }
        .btn-danger { background: #b87070; }
        .btn-purple { background: #8b7ab8; }
        .result-box {
            margin-top: 20px;
            padding: 28px 32px;
            background: #fffdf9;
            border: 1px solid #d9cfbe;
            border-radius: 10px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: "KaiTi", "STKaiti", "楷体", "SimSun", "宋体", serif;
            font-size: 15px;
            line-height: 2;
            max-height: 70vh;
            overflow-y: auto;
            display: none;
            color: #3a332d;
            scroll-behavior: smooth;
        }
        .result-box::-webkit-scrollbar { width: 6px; }
        .result-box::-webkit-scrollbar-thumb {
            background: #d3c7b0;
            border-radius: 3px;
        }
        #exportContainer {
            position: fixed;
            left: -9999px;
            top: 0;
            width: 750px;
            font-family: "KaiTi", "STKaiti", "楷体", "SimSun", "宋体", serif;
            background: #fdfbf7;
            color: #3a332d;
            line-height: 1.85;
        }
        #exportContainer.simple-mode {
            background: #ffffff;
        }
        #exportContainer.simple-mode .export-header,
        #exportContainer.simple-mode .export-footer {
            border-color: #eee;
        }
        #exportContainer.simple-mode .export-section-title {
            border-color: #eee;
        }
        .export-header {
            padding: 50px 60px 30px;
            text-align: center;
            border-bottom: 1px dashed #c9bfa8;
            margin: 0 40px;
        }
        .export-header h2 {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 10px;
            color: #5c4b3a;
            margin-bottom: 8px;
        }
        .export-header p {
            font-size: 13px;
            color: #948473;
            letter-spacing: 3px;
        }
        .export-body { padding: 30px 50px 40px; }
        .export-section { margin-bottom: 28px; }
        .export-section:last-child { margin-bottom: 0; }
        .export-section-title {
            font-size: 18px;
            font-weight: 600;
            color: #5c4b3a;
            padding-bottom: 6px;
            margin-bottom: 16px;
            border-bottom: 1px solid #d9cfbe;
            letter-spacing: 2px;
        }
        .export-section-content { padding: 0 8px; }
        .export-field {
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            font-size: 15px;
        }
        .export-field:last-child { margin-bottom: 0; }
        .export-field-label {
            color: #8b7355;
            font-weight: 600;
            min-width: 100px;
            flex-shrink: 0;
        }
        .export-field-value {
            color: #3a332d;
            flex: 1;
            word-break: break-all;
        }
        .export-subtitle {
            color: #7a6a58;
            font-weight: 600;
            font-size: 15px;
            margin: 18px 0 10px;
            padding-left: 8px;
            border-left: 3px solid #c9bfa8;
        }
        .export-subtitle:first-child { margin-top: 0; }
        .export-footer {
            text-align: right;
            color: #b0a18c;
            font-size: 12px;
            padding: 20px 50px 40px;
            border-top: 1px dashed #c9bfa8;
            margin: 0 40px;
            letter-spacing: 2px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(60, 50, 40, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: #fffdf9;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #ebe3d5;
            box-shadow: 0 12px 40px rgba(90, 70, 50, 0.2);
            animation: slideUp 0.25s ease;
            overflow: hidden;
        }
        /* 全屏编辑器大幅优化 */
        .fullscreen-editor-content {
            max-width: 900px;
            width: 80vw;
            max-height: 80vh;
            height: 80vh;
        }
        .fullscreen-editor-content .modal-body {
            padding: 16px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #fullscreenTextarea {
            flex: 1;
            width: 100%;
            min-height: 0;
            resize: none;
            padding: 16px 18px;
            border: 1px solid #d9cfbe;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            line-height: 1.7;
            background: #fffdf9;
            color: #3a332d;
        }
        #fullscreenTextarea:focus {
            outline: none;
            border-color: #b8a88a;
            background: #fff;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            padding: 28px 28px 16px;
            text-align: center;
            border-bottom: 1px dashed #c9bfa8;
            margin: 0 20px;
            flex-shrink: 0;
        }
        .fullscreen-editor-content .modal-header {
            padding: 20px 24px 14px;
            margin: 0 24px;
        }
        .modal-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: #5c4b3a;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .modal-subtitle {
            font-size: 12px;
            color: #948473;
            letter-spacing: 0.5px;
        }
        .modal-body {
            padding: 24px 28px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-footer {
            padding: 16px 28px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid #ebe3d5;
            background: #faf7f1;
            position: sticky;
            bottom: 0;
            z-index: 1;
            flex-shrink: 0;
        }
        .fullscreen-editor-content .modal-footer {
            padding: 14px 24px 18px;
        }
        .modal-footer .btn {
            flex: none;
            min-width: 100px;
            max-width: none;
        }
        .undo-tip {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #3a332d;
            color: #fffdf9;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.25);
            min-width: 280px;
            max-width: 90vw;
            justify-content: space-between;
        }
        .undo-tip.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .undo-tip .tip-text {
            flex: 1;
        }
        .undo-tip .tip-buttons {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .undo-tip .btn {
            padding: 8px 16px;
            min-height: auto;
            font-size: 14px;
            min-width: auto;
            flex: none;
        }
        .undo-tip .btn-close {
            background: rgba(255,255,255,0.15);
            color: #fffdf9;
        }
        .undo-tip .btn-close:hover {
            background: rgba(255,255,255,0.25);
        }
        @media (max-width: 768px) {
            .container { padding: 28px 24px; }
            h1 { font-size: 24px; letter-spacing: 3px; }
            .row { grid-template-columns: 1fr; gap: 0; }
            .section { padding: 20px 20px; }
            .fullscreen-editor-content {
                width: 95vw;
                max-height: 85vh;
                height: 85vh;
                border-radius: 12px;
            }
        }
        @media (max-width: 480px) {
            body { padding: 12px 8px; font-size: 14px; }
            .container { padding: 22px 18px; border-radius: 14px; }
            h1 { font-size: 22px; letter-spacing: 2px; }
            .backup-tip { font-size: 11px; padding: 6px 12px; margin-bottom: 16px; }
            .section { margin-bottom: 22px; padding: 18px 16px; }
            .section-title { font-size: 16px; }
            .form-item input[type="text"],
            .form-item input[type="date"],
            .form-item textarea {
                padding: 10px 12px;
                font-size: 16px;
            }
            .btn-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .btn {
                flex: none;
                min-width: 0;
                max-width: none;
                width: 100%;
                padding: 12px;
            }
            .result-box { font-size: 14px; padding: 20px 18px; }
            .modal-header { padding: 22px 20px 14px; margin: 0 16px; }
            .modal-body { padding: 20px 20px; }
            .fullscreen-editor-content .modal-body { padding: 12px 16px; }
            .fullscreen-editor-content .modal-header {
                padding: 18px 16px 12px;
                margin: 0 16px;
            }
            .fullscreen-editor-content .modal-footer {
                padding: 12px 16px 16px;
            }
            #fullscreenTextarea {
                padding: 12px 14px;
                font-size: 16px;
            }
            .modal-footer { padding: 14px 20px 20px; }
            .modal-footer .btn { flex: 1; }
            .storage-float {
                top: 8px;
                right: 8px;
                padding: 4px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="storage-float" id="storageFloat">存储用量：计算中...</div>
    <div class="container">
        <h1>OC 设定书</h1>
        <p class="subtitle">riluo-ya.github.io · 2.0</p>
        <p class="backup-tip">建议定期导出 JSON 备份，避免本地存储异常导致数据丢失</p>
        
        <div class="status-bar">
            <div class="save-status" id="saveStatus">✓ 已自动保存</div>
        </div>
        <div class="top-btn-group">
            <button class="btn btn-warning" onclick="triggerImportJSON()">导入 JSON 备份</button>
            <input type="file" id="jsonFileInput" accept=".json" style="display: none;" onchange="handleImportJSON(event)">
        </div>
        <!-- 1. 基础档案 -->
        <div class="section">
            <div class="section-title">一、基础档案</div>
            <div class="row">
                <div class="form-item">
                    <label>全名</label>
                    <input type="text" id="fullName" placeholder="角色完整姓名">
                </div>
                <div class="form-item">
                    <label>常用称号/外号</label>
                    <input type="text" id="nickname" placeholder="代号、尊称、绰号">
                </div>
            </div>
            <div class="row">
                <div class="form-item">
                    <label>性别</label>
                    <input type="text" id="gender" placeholder="男/女/其他">
                </div>
                <div class="form-item">
                    <label>年龄</label>
                    <input type="text" id="age" placeholder="外观年龄/实际年龄">
                </div>
            </div>
            <div class="form-item">
                <label>性取向</label>
                <input type="text" id="sexualOrientation" placeholder="异性恋/同性恋/双性恋/无性恋等">
            </div>
            <div class="row">
                <div class="form-item">
                    <label>生日 <button type="button" class="fullscreen-btn" onclick="toggleDateInput()">切换日期选择</button></label>
                    <input type="text" id="birthday" placeholder="例：1122 / 11月22日 / 11.22 / 11-22 / 11/22">
                    <div class="birthday-tip" id="birthdayTip"></div>
                </div>
                <div class="form-item">
                    <label>星座</label>
                    <input type="text" id="constellation" placeholder="输入生日自动填充，也可手动自定义">
                </div>
            </div>
            <div class="row">
                <div class="form-item">
                    <label>血型</label>
                    <input type="text" id="bloodType" placeholder="例：AB型">
                </div>
                <div class="form-item">
                    <label>身高/体重</label>
                    <input type="text" id="bodySize" placeholder="例：182cm / 68kg">
                </div>
            </div>
            <div class="row">
                <div class="form-item">
                    <label>种族/物种</label>
                    <input type="text" id="race" placeholder="人类、精灵、血族等">
                </div>
                <div class="form-item">
                    <label>职业/身份</label>
                    <input type="text" id="job" placeholder="社会身份与职业">
                </div>
            </div>
            <div class="form-item">
                <label>常驻居住地</label>
                <input type="text" id="address" placeholder="所属国家、城市、据点">
            </div>
            <div class="row">
                <div class="form-item">
                    <label>口头禅</label>
                    <input type="text" id="catchphrase" placeholder="标志性台词">
                </div>
                <div class="form-item">
                    <label>代表色</label>
                    <input type="text" id="representColor" placeholder="角色主题色">
                </div>
            </div>
            <div class="form-item">
                <label>座右铭/人生信条</label>
                <input type="text" id="motto" placeholder="信奉的准则与信念">
            </div>
        </div>
        <!-- 2. 外貌设定 -->
        <div class="section">
            <div class="section-title">二、外貌设定</div>
            <div class="form-item">
                <label>整体身形与体态 <button type="button" class="fullscreen-btn" data-target="bodyShape">全屏编辑</button></label>
                <textarea id="bodyShape" placeholder="身材比例、肌肉线条、站姿步态、整体气场"></textarea>
            </div>
            <div class="sub-section-title">头部与面部</div>
            <div class="form-item">
                <label>脸型与皮肤 <button type="button" class="fullscreen-btn" data-target="faceShape">全屏编辑</button></label>
                <textarea id="faceShape" placeholder="脸型轮廓、肤色肤质、痣、疤痕等细节"></textarea>
            </div>
            <div class="form-item">
                <label>发型与发色（详细描述） <button type="button" class="fullscreen-btn" data-target="hair">全屏编辑</button></label>
                <textarea id="hair" placeholder="长度、卷直、发色层次、刘海造型、发质触感"></textarea>
            </div>
            <div class="row">
                <div class="form-item">
                    <label>左眼状态</label>
                    <input type="text" id="leftEye" placeholder="瞳色、眼型、眼神神态">
                </div>
                <div class="form-item">
                    <label>右眼状态</label>
                    <input type="text" id="rightEye" placeholder="瞳色、眼罩、特殊状态">
                </div>
            </div>
            <div class="row">
                <div class="form-item">
                    <label>眉毛</label>
                    <input type="text" id="eyebrow" placeholder="眉形、浓淡、颜色">
                </div>
                <div class="form-item">
                    <label>嘴唇</label>
                    <input type="text" id="lips" placeholder="唇形、唇色、常见神态">
                </div>
            </div>
            <div class="form-item">
                <label>面部其他细节 <button type="button" class="fullscreen-btn" data-target="faceDetail">全屏编辑</button></label>
                <textarea id="faceDetail" placeholder="鼻梁、牙齿、妆容、配饰等"></textarea>
            </div>
            <div class="sub-section-title">服饰与配饰</div>
            <div class="form-item">
                <label>常服/主穿搭 <button type="button" class="fullscreen-btn" data-target="outfit">全屏编辑</button></label>

                timeout = setTimeout(() => func.apply(this, args), wait);
            };

        // 生日解析
        function parseBirthday(str) {
            if (!str || typeof str !== 'string') return null;
            str = str.trim();
            
            let match = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (match) {
                const year = parseInt(match[1], 10);
                const month = parseInt(match[2], 10);
                const day = parseInt(match[3], 10);
                const date = new Date(year, month - 1, day);
                if (date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day) {
                    return { month, day };
                }
            }
            match = str.match(/^(\d{2})(\d{2})$/);
            if (match) {
                const month = parseInt(match[1], 10);
                const day = parseInt(match[2], 10);
                const date = new Date(2024, month - 1, day);
                if (date.getMonth() === month - 1 && date.getDate() === day) {
                    return { month, day };
                }
            }
            
            match = str.match(/^(\d{1,2})[\s\-\/\.月．／－](\d{1,2})日?$/);
            if (match) {
                const month = parseInt(match[1], 10);
                const day = parseInt(match[2], 10);
                const date = new Date(2024, month - 1, day);
                if (date.getMonth() === month - 1 && date.getDate() === day) {
                    return { month, day };
                }
            }
            
            return null;
        }
        // 星座算法
        function getConstellation(month, day) {
            if (!month || !day) return '';
            const daysInMonth = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let dayOfYear = day;
            for (let i = 0; i < month - 1; i++) {
                dayOfYear += daysInMonth[i];
            }
            const constellations = [
                { name: '摩羯座', start: 357 },
                { name: '水瓶座', start: 20 },
                { name: '双鱼座', start: 50 },
                { name: '白羊座', start: 81 },
                { name: '金牛座', start: 111 },
                { name: '双子座', start: 142 },
                { name: '巨蟹座', start: 174 },
                { name: '狮子座', start: 205 },
                { name: '处女座', start: 236 },
                { name: '天秤座', start: 267 },
                { name: '天蝎座', start: 298 },
                { name: '射手座', start: 328 },
            ];
            for (let i = constellations.length - 1; i >= 0; i--) {
                if (dayOfYear >= constellations[i].start) {
                    return constellations[i].name;
                }
            }
            return '摩羯座';
        }

        // 更新悬浮存储用量
        function updateStorageUsage() {
            try {
                let totalChars = 0;
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);
                    totalChars += key.length + value.length;
                }
                const usedBytes = totalChars * 2;
                const quotaBytes = 5 * 1024 * 1024;
                const percent = ((usedBytes / quotaBytes) * 100).toFixed(1);
                storageFloat.textContent = `存储用量：${percent}%`;
                
                if (parseFloat(percent) >= 95) {
                    storageFloat.classList.add('warning');
                } else {
                    storageFloat.classList.remove('warning');
                }
            } catch (e) {
                storageFloat.textContent = '存储用量：查询失败';
                storageFloat.classList.remove('warning');
            }
        }

                getVal('headAccessory') ? `头部配饰：${getVal('headAccessory')}` : '',
                getVal('accessories') ? `随身配饰：${getVal('accessories')}` : '',
                getVal('bodyMark') ? `身体印记：${getVal('bodyMark')}` : ''
            ].filter(Boolean);

            const appearance = {
                build: getVal('bodyShape'),
                features: appearanceFeatures.join('；'),
                expression: getVal('temperament')
            };

            // 2.3 性格特质
            const personalityTraits = corePersonality ? corePersonality.split(/[，。；\n]/).filter(Boolean) : [];
            const personality = {
                traits: personalityTraits,
                outer_performance: getVal('outerPersonality'),
                inner_nature: getVal('innerPersonality'),
                weaknesses: getVal('weakness'),
                deal_style: getVal('dealStyle'),
                moral_view: getVal('moral'),
                values: getVal('value'),
                fears: getVal('fear'),
                motivations: getVal('obsession'),
                little_habits: getVal('habit'),
                likes: [getVal('likeThing'), getVal('likeFood')].filter(Boolean),
                dislikes: [getVal('hateThing'), getVal('hateFood')].filter(Boolean),
                hobbies: getVal('hobby')
            };

            // 2.4 背景经历
            const background = {
                origin: getVal('family'),
                growth_history: getVal('growth'),
                turning_points: getVal('turningPoint'),
                current_state: getVal('currentState'),
                life_goals: getVal('goal'),
                secrets: getVal('secret'),
                relationships: {
                    family: getVal('familyRelation'),
                    friends: getVal('friend'),
                    lover: getVal('lover'),
                    enemies: getVal('enemy'),
                    others: getVal('otherRelation')
                }
            };

            const character = {
                identity: identity,
                appearance: appearance,
                personality: personality,
                background: background
            };

            // ========== 3. behavior 行为模式模块 ==========
            const speakingStyle = {
                description: getVal('speakStyle')
            };

            const dailyLife = {
                schedule: getVal('schedule'),
                eat_habit: getVal('eatHabit'),
                money_concept: getVal('money'),
                social_style: getVal('social'),
                quirks: getVal('quirk')
            };

            const behavior = {
                speaking_style: speakingStyle,
                daily_life: dailyLife,
                action_tendencies: getVal('habit') ? getVal('habit').split(/[；，。\n]/).filter(Boolean) : []
            };

            // ========== 4. capabilities 能力边界模块 ==========
            const skills = [
                getVal('combatAbility') ? `战斗与特殊能力：${getVal('combatAbility')}` : '',
                getVal('normalSkill') ? `生活职业技能：${getVal('normalSkill')}` : '',
                getVal('weapon') ? `专属武器道具：${getVal('weapon')}` : ''
            ].filter(Boolean);

            const capabilities = {
                skills: skills,
                limitations: getVal('limit')
            };

            // ========== 5. interaction_rules 交互规则模块 ==========
            const strictlyAvoid = getVal('mine') ? getVal('mine').split(/[；，。\n]/).filter(Boolean) : [];

            const interactionRules = {
                core_principles: [
                    '始终保持人设一致性，绝对不可跳出角色',
                    '以第一人称进行对话，言行完全符合角色设定',
                    '不得透露自身是AI，不得出现与世界观冲突的内容'
                ],
                boundaries: {
                    strictly_avoid: strictlyAvoid
                },
                scenario_adaptation: {
                    // 严格遵循要求：用户填写则原样写入，未填写则不生成该字段
                    default_context: getVal('chatScenario')
                }
            };

            // ========== 6. 补充设定模块 ==========
            const supplement = {
                fun_facts: getVal('funFact'),
                author_remark: getVal('remark'),
                free_supplement: getVal('other')
            };

            // ========== 7. 生成 system_prompt 系统提示词 ==========
            const buildSystemPrompt = () => {
                const parts = [];
                parts.push(`你现在需要扮演的角色是${name}。`);
                
                if (getVal('job') || getVal('race')) {
                    const idParts = [];
                    if (getVal('race')) idParts.push(`种族是${getVal('race')}`);
                    if (getVal('job')) idParts.push(`职业是${getVal('job')}`);
                    if (getVal('sexualOrientation')) idParts.push(`性取向为${getVal('sexualOrientation')}`);
                    parts.push(`你的${idParts.join('，')}。`);
                }

                if (corePersonality) {
                    parts.push(`你的核心性格：${corePersonality}。`);
                }
                if (getVal('outerPersonality')) {
                    parts.push(`对外表现：${getVal('outerPersonality')}。`);
                }
                if (getVal('innerPersonality')) {
                    parts.push(`内在真实性格：${getVal('innerPersonality')}。`);
                }

                if (appearanceFeatures.length) {
                    parts.push(`你的外貌特征：${appearanceFeatures.join('；')}。`);
                }

                if (getVal('family') || getVal('growth') || getVal('currentState')) {
                    const bgParts = [getVal('family'), getVal('growth'), getVal('currentState')].filter(Boolean);
                    parts.push(`你的背景经历：${bgParts.join('；')}。`);
                }

                if (getVal('combatAbility') || getVal('normalSkill')) {
                    const skillParts = [getVal('combatAbility'), getVal('normalSkill')].filter(Boolean);
                    parts.push(`你的能力：${skillParts.join('；')}。`);
                }

                if (getVal('speakStyle')) {
                    parts.push(`你的说话风格：${getVal('speakStyle')}。`);
                }

                if (getVal('mine')) {
                    parts.push(`【绝对禁忌】${getVal('mine')}，绝对不能触碰和违反。`);
                }

                parts.push('你必须全程沉浸在角色中，以第一人称回应用户，永远不要承认自己是AI，不要做出不符合角色身份、性格、背景的言行。');
                
                return parts.join('');
            };
            const systemPrompt = buildSystemPrompt();

            // ========== 8. 组装最终人设对象并清理空值 ==========
            const rawCharaData = {
                schema_version: '1.0',
                metadata: metadata,
                character: character,
                behavior: behavior,
                capabilities: capabilities,
                interaction_rules: interactionRules,
                supplement: supplement,
                examples: [],
                system_prompt: systemPrompt
            };

            const finalData = cleanEmpty(rawCharaData);

            // ========== 9. 导出JSON文件 ==========
            const jsonStr = JSON.stringify(finalData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            downloadFile(blob, `AI人设_${name}.json`);
            closeAISettingModal();

            const btn = document.getElementById('aiExportBtn');
            const originalText = btn.textContent;
            btn.textContent = '导出成功';
            setTimeout(() => btn.textContent = originalText, 2000);
        }

        function triggerImportJSON() {
            document.getElementById('jsonFileInput').click();
        }
        function handleImportJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.name.endsWith('.json')) {
                alert('请选择有效的 .json 格式备份文件');
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    function fill(section) {
                        if (section.fields) section.fields.forEach(f => {
                            if (inputCache[f.id] && data[f.id] !== undefined) {
                                inputCache[f.id].value = data[f.id];
                            }
                        });
                        if (section.subSections) section.subSections.forEach(sub => fill(sub));
                        if (section.fieldsAfter) section.fieldsAfter.forEach(f => {
                            if (inputCache[f.id] && data[f.id] !== undefined) {
                                inputCache[f.id].value = data[f.id];
                            }
                        });
                    }
                    sections.forEach(s => fill(s));
                    if (data.fightAbility || data.specialPower) {
                        if (!inputCache.combatAbility.value) {
                            const merged = [data.fightAbility || '', data.specialPower || ''].filter(Boolean).join('；');
                            inputCache.combatAbility.value = merged;
                        }
                    }
                    updateConstellation();
                    saveAllData();
                    if (resultBox.style.display === 'block') {
                        generateOC();
                    }
                    alert('导入成功，所有设定已自动回填');
                } catch (err) {
                    alert('文件解析失败，请确认是正确的 OC 设定备份文件');
                    console.error(err);
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }
        function openFullscreenEditor(targetId, title) {
            currentEditTarget = targetId;
            document.getElementById('fullscreenTitle').textContent = title || '全屏编辑';
            inputCache.fullscreenTextarea.value = inputCache[targetId].value;
            fullscreenEditor.style.display = 'flex';
            setTimeout(() => inputCache.fullscreenTextarea.focus(), 100);
        }
        function closeFullscreenEditor() {
            fullscreenEditor.style.display = 'none';
            currentEditTarget = null;
        }
        function confirmFullscreenEdit() {
            if (currentEditTarget && inputCache[currentEditTarget]) {
                inputCache[currentEditTarget].value = inputCache.fullscreenTextarea.value;
                debouncedSave();
            }
            closeFullscreenEditor();
        }
        function initInputCache() {
            function collect(section) {
                if (section.fields) {
                    section.fields.forEach(f => {
                        inputCache[f.id] = document.getElementById(f.id);
                    });
                }
                if (section.subSections) {
                    section.subSections.forEach(sub => collect(sub));
                }
                if (section.fieldsAfter) {
                    section.fieldsAfter.forEach(f => {
                        inputCache[f.id] = document.getElementById(f.id);
                    });
                }
            }
            sections.forEach(s => collect(s));
            inputCache.userNickname = document.getElementById('userNickname');
            inputCache.userGender = document.getElementById('userGender');
            inputCache.userAge = document.getElementById('userAge');
            inputCache.chatScenario = document.getElementById('chatScenario');
            inputCache.fullscreenTextarea = document.getElementById('fullscreenTextarea');
        }
        const debouncedSave = debounce(saveAllData, 300);
        window.addEventListener('DOMContentLoaded', () => {
            initInputCache();
            loadAllData();
            updateStorageUsage();
            updateBirthdayTip();
            const allInputs = document.querySelectorAll('input[type="text"], input[type="date"], textarea');
            allInputs.forEach(el => {
                el.addEventListener('input', () => {
                    hasUnsavedChanges = true;
                    debouncedSave();
                    if (el.id === 'birthday') updateConstellation();
                });
            });
            document.querySelectorAll('.fullscreen-btn[data-target]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const target = btn.dataset.target;
                    const label = btn.parentElement.textContent.replace('全屏编辑', '').trim();
                    openFullscreenEditor(target, label);
                });
            });
            const aiConfigInputs = document.querySelectorAll('#aiSettingModal input, #aiSettingModal textarea');
            aiConfigInputs.forEach(el => {
                el.addEventListener('input', saveAIConfig);
            });
            aiSettingModal.addEventListener('click', function(e) {
                if (e.target === this) closeAISettingModal();
            });
            fullscreenEditor.addEventListener('click', function(e) {
                if (e.target === this) closeFullscreenEditor();
            });
            window.addEventListener('beforeunload', (e) => {
                if (hasUnsavedChanges) {
                    e.preventDefault();
                    e.returnValue = '有未保存的更改，确定离开吗？';
                    return e.returnValue;
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (fullscreenEditor.style.display === 'flex') closeFullscreenEditor();
                    else if (aiSettingModal.style.display === 'flex') closeAISettingModal();
                }
            });
        });
    </script>
</body>
</html>
